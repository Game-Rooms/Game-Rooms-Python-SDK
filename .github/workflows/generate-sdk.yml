name: Generate SDK from Documentation

on:
  workflow_dispatch:
    inputs:
      docs_url:
        description: "URL to the documentation markdown describing the API/service to generate an SDK for"
        required: true
        type: string
      target_branch:
        description: "Branch to create with the generated SDK (a PR will be opened against the default branch)"
        required: false
        default: "generate-sdk"
        type: string
      language:
        description: "Target language/platform for the generated SDK (e.g. typescript, python, csharp)"
        required: false
        default: "typescript"
        type: string
  
  # Lets this workflow be triggered over plain HTTP, e.g.:
  #   curl -X POST \
  #     -H "Accept: application/vnd.github+json" \
  #     -H "Authorization: Bearer <token-with-repo-scope>" \
  #     https://api.github.com/repos/Game-Rooms/Game-Rooms-SDK-Template/dispatches \
  #     -d '{"event_type":"generate-sdk","client_payload":{"docs_url":"https://.../PROTOCOL.md","language":"typescript"}}'
  repository_dispatch:
    types: [generate-sdk]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-sdk-${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCS_URL: ${{ github.event.inputs.docs_url || github.event.client_payload.docs_url }}
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.event.client_payload.target_branch || 'generate-sdk' }}
  LANGUAGE: ${{ github.event.inputs.language || github.event.client_payload.language || 'typescript' }}

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [ -z "$DOCS_URL" ]; then
            echo "::error::docs_url (or client_payload.docs_url) is required"
            exit 1
          fi
          echo "Generating SDK from: $DOCS_URL"

      - name: Generate SDK with GitHub Copilot
        id: copilot
        uses: mvkaran/gh-copilot@v1
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
          prompt-file: .github/prompts/generate-sdk.md
          system-prompt: |
            Documentation URL: ${{ env.DOCS_URL }}
            Target SDK language/platform: ${{ env.LANGUAGE }}
            Repository: ${{ github.repository }}
          output-format: markdown
          output-file: .github/generated-sdk-summary.md
          timeout: 30

      - name: Show Copilot summary
        run: cat .github/generated-sdk-summary.md

      - name: Open pull request with generated SDK
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.TARGET_BRANCH }}
          commit-message: "Generate SDK from documentation (${{ env.DOCS_URL }})"
          title: "Generate SDK from documentation"
          body: |
            Automatically generated by the `Generate SDK from Documentation` workflow.

            **Source documentation:** ${{ env.DOCS_URL }}

            ---
            ${{ steps.copilot.outputs.response }}
          delete-branch: true
